# MinIO fixture for the kind-based e2e test, standing in for the S3-compatible
# backend the fileBackup CronJob and fileImport Job talk to. Also seeds the
# bucket tests/kind/values-extras.yaml's fileImport reads from.
# CI fixture only - not for production use.
---
apiVersion: v1
kind: Secret
metadata:
  name: wordpress-minio
  namespace: wordpress
type: Opaque
stringData:
  MINIO_ROOT_USER: minioadmin
  MINIO_ROOT_PASSWORD: minioadmin123
---
# Name/keys expected by the chart's backup/import CronJobs and Jobs.
apiVersion: v1
kind: Secret
metadata:
  name: s3-storage
  namespace: wordpress
type: Opaque
stringData:
  S3_URL: http://wordpress-minio:9000
  S3_ACCESS_KEY: minioadmin
  S3_SECRET_KEY: minioadmin123
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: wordpress-file-import-seed
  namespace: wordpress
data:
  hello.txt: |
    e2e file-import fixture
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordpress-minio
  namespace: wordpress
  labels:
    app: wordpress-minio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wordpress-minio
  template:
    metadata:
      labels:
        app: wordpress-minio
    spec:
      automountServiceAccountToken: false
      containers:
        - name: minio
          image: minio/minio:latest
          args: ["server", "/data"]
          envFrom:
            - secretRef:
                name: wordpress-minio
          ports:
            - containerPort: 9000
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: wordpress-minio
  namespace: wordpress
  labels:
    app: wordpress-minio
spec:
  ports:
    - port: 9000
      protocol: TCP
  selector:
    app: wordpress-minio
---
# One-shot bucket + fixture seeding, run once MinIO is ready.
apiVersion: batch/v1
kind: Job
metadata:
  name: wordpress-minio-seed
  namespace: wordpress
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: seed
          image: minio/mc:latest
          command:
            - /bin/sh
            - -c
            - |
              set -euo pipefail
              mc alias set s3 http://wordpress-minio:9000 minioadmin minioadmin123
              mc mb -p s3/wordpress-backups
              mc mb -p s3/wordpress-files
              mc cp /seed/hello.txt s3/wordpress-files/hello.txt
              echo "Seed complete"
          volumeMounts:
            - name: seed
              mountPath: /seed
      volumes:
        - name: seed
          configMap:
            name: wordpress-file-import-seed
