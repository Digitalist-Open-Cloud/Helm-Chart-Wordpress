# Phase 2 overlay for the kind e2e test: layers the S3-backed file backup
# CronJob and the file import hook Job on top of tests/kind/values.yaml.
# Applied as a fresh install (not an upgrade) so the post-install import
# hook actually fires. Points at the MinIO fixture (tests/kind/minio.yaml),
# which pre-seeds the bucket fileImport reads from.
#
# dbBackup/dbImport are deliberately left disabled here: they shell out to
# `wp` and `mariadb`/`mysql` (cronjob-db-backup.yaml, job-db-import.yaml),
# neither of which the chart's default image.tag
# (wordpress:5.7-php7.4-fpm-alpine) ships - confirmed by inspecting the
# image directly. That's a real gap in the default image, not something an
# e2e test can paper over, so it's exercised only structurally by
# tests/render/backups-and-imports.yaml, not functionally here.
fileBackup:
  enabled: true
  schedule: "30 2 * * *"
  bucket: wordpress-backups

fileImport:
  enabled: true
  bucket: wordpress-files
