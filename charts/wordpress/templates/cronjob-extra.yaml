{{- range .Values.extraCronJobs }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "wordpress.fullname" $ }}-{{ .name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "wordpress.labels" $ | nindent 4 }}
spec:
  schedule: {{ .schedule | quote }}
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          {{- with $.Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            {{- toYaml $.Values.podSecurityContext | nindent 12 }}
          containers:
            - name: {{ .name }}
              image: "{{ $.Values.image.repository }}:{{ $.Values.image.tag }}"
              imagePullPolicy: {{ $.Values.image.pullPolicy }}
              securityContext:
                {{- toYaml $.Values.securityContext | nindent 16 }}
              command:
                {{- toYaml .command | nindent 16 }}
              env:
                {{- range $.Values.env }}
                {{- if .valueFromSecret }}
                - name: {{ .name }}
                  valueFrom:
                    secretKeyRef:
                      name: {{ .valueFromSecret.secretName | quote }}
                      key: {{ .valueFromSecret.key | quote }}
                {{- else if .value }}
                - name: {{ .name }}
                  value: {{ .value | quote }}
                {{- end }}
                {{- end }}
              resources:
                {{- toYaml $.Values.resources | nindent 16 }}
              {{- if or $.Values.dotenv.enabled $.Values.wordpressEnvs }}
              volumeMounts:
                {{- if $.Values.dotenv.enabled }}
                - name: dotenv-file
                  mountPath: /var/www/html/.env
                  subPath: .env
                {{- end }}
                {{- range $env, $val := $.Values.wordpressEnvs }}
                - name: env-{{ $env }}
                  mountPath: /var/www/html/config/environments/{{ $env }}.php
                  subPath: {{ $env }}.php
                {{- end }}
              {{- end }}
          {{- if or $.Values.dotenv.enabled $.Values.wordpressEnvs }}
          volumes:
            {{- if $.Values.dotenv.enabled }}
            - name: dotenv-file
              secret:
                secretName: {{ $.Values.dotenv.name }}
            {{- end }}
            {{- range $env, $val := $.Values.wordpressEnvs }}
            - name: env-{{ $env }}
              configMap:
                name: {{ include "wordpress.fullname" $ }}-env-{{ $env }}
            {{- end }}
          {{- end }}
{{- end }}
