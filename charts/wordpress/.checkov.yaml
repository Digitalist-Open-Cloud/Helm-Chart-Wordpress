# Checkov configuration for the WordPress chart.
# Each skip below is a deliberate policy decision.
skip-check:
  # Privileged / allowPrivilegeEscalation: the copy-wordpress init container
  # (and the files-backup/files-import Job containers) run privileged to
  # copy and chown WordPress source and uploads across the php-fpm (uid 82)
  # and nginx (uid 100) UID boundary onto shared volumes.
  - CKV_K8S_16
  - CKV_K8S_20
  # Capabilities assigned / NET_RAW: a side effect of the privileged
  # containers above - `privileged: true` already grants the full
  # capability set, so an explicit capabilities.drop there is moot.
  - CKV_K8S_37
  - CKV_K8S_28
  # Secrets as environment variables: DB_PASSWORD and the S3_* credentials
  # are consumed as env vars sourced from Kubernetes Secrets via
  # secretKeyRef - that's the mechanism the wp-config/WP-CLI/mc tooling in
  # this chart expects.
  - CKV_K8S_35
  # Image digests: the chart pins version tags (image.tag, nginx.tag) to
  # support registry overrides; hard-coded digests would break that and
  # make every image bump a multi-line change.
  - CKV_K8S_43
  # High UID (>= 10000): uid 82 (www-data) is baked into the wordpress
  # image's file ownership, and nginx runs at uid 100 (digitalist/nginx's
  # own user) - raising either breaks file permissions at runtime.
  - CKV_K8S_40
  # Read-only root filesystem: php-fpm, nginx and opcache all write to /tmp,
  # pid files and cache directories. Needs per-image writable-path mapping
  # to emptyDir mounts.
  - CKV_K8S_22
  # Liveness/readiness probes: wordpress.livenessProbe/readinessProbe are
  # opt-in and empty by default (values.yaml) - no default probe fits every
  # deployment topology (subpaths, custom health endpoints). Known gap, not
  # a policy decision; left for a follow-up rather than guessing a default.
  - CKV_K8S_8
  - CKV_K8S_9
  # Image pull policy: nginx's imagePullPolicy is hard-coded to IfNotPresent
  # in templates/deployment.yaml regardless of nginx.pullPolicy - a
  # pre-existing inconsistency, not something to silently change here since
  # it would alter default deploy behavior.
  - CKV_K8S_15
  # NetworkPolicy: this chart does not ship a NetworkPolicy resource; that's
  # left to the cluster/platform's own network policy tooling.
  - CKV2_K8S_6
