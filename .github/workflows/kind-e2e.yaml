name: E2E (kind)

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: Install chart on kind
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Create kind cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # See ../../Dockerfile for what this is and why the chart's own
      # default image doesn't work as-is for this test. Built with the GitHub
      # Actions cache (composer/apk steps are network-heavy) and loaded
      # straight into the docker daemon so kind can pick it up.
      - name: Build the e2e fixture WordPress image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          tags: wordpress-bedrock-test:local
          push: false
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Load the e2e fixture image into kind
        run: kind load docker-image wordpress-bedrock-test:local --name chart-testing

      - name: Create namespace
        run: kubectl create namespace wordpress

      # ── Database fixture ────────────────────────────────────────────────
      - name: Install MariaDB
        run: |
          kubectl apply -f tests/kind/mariadb.yaml
          kubectl -n wordpress rollout status deployment/wordpress-mariadb --timeout=300s

      # ── Ingress infrastructure (ingress-nginx) ─────────────────────────
      - name: Install ingress-nginx
        run: |
          kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.15.1/deploy/static/provider/cloud/deploy.yaml
          kubectl -n ingress-nginx rollout status deployment/ingress-nginx-controller --timeout=300s

      # ── Install (ingress, no S3-backed features) ────────────────────────
      - name: Install WordPress chart
        run: |
          helm install wordpress charts/wordpress --namespace wordpress \
            --values tests/kind/values.yaml

      - name: Wait for WordPress rollout
        run: kubectl -n wordpress rollout status deployment/wordpress --timeout=300s

      - name: Verify PVC bound
        run: |
          phase=$(kubectl -n wordpress get pvc wordpress-data -o jsonpath='{.status.phase}')
          if [ "$phase" != "Bound" ]; then
            echo "::error::wordpress-data PVC is not Bound (phase=$phase)"
            kubectl -n wordpress describe pvc wordpress-data
            exit 1
          fi
          echo "wordpress-data PVC is Bound"

      # A fresh install with an empty database redirects "/" to the WP
      # installer - real WordPress/Bedrock behavior (nginx -> php-fpm ->
      # WordPress -> MariaDB all actually working), not a fixture string.
      - name: Smoke test nginx/php-fpm wiring (in-cluster)
        run: |
          kubectl -n wordpress run smoke --rm -i --restart=Never \
            --image=curlimages/curl:8.14.1 --command -- sh -c '
            set -e
            headers=$(curl -sS -o /dev/null -D - http://wordpress/)
            echo "ClusterIP response headers:"
            echo "$headers"
            echo "$headers" | grep -qi "^HTTP/.* 302"
            echo "$headers" | grep -qi "^Location:.*wp-admin/install.php"
            '

      - name: Test routing through ingress-nginx
        run: |
          kubectl -n wordpress run ingress-smoke --rm -i --restart=Never \
            --image=curlimages/curl:8.14.1 --command -- sh -c '
            set -e
            HOST=ingress-nginx-controller.ingress-nginx.svc.cluster.local
            headers=$(curl -sS -o /dev/null -D - -H "Host: wordpress.example.test" "http://$HOST/")
            echo "Ingress response headers:"
            echo "$headers"
            echo "$headers" | grep -qi "^HTTP/.* 302"
            echo "$headers" | grep -qi "^Location:.*wp-admin/install.php"
            '

      # dbBackup/fileBackup/dbImport/fileImport (S3-backed) are not exercised
      # here - live S3 integration testing was dropped for being too
      # complicated (deprecated MinIO images, then OOMKilling on the
      # replacement) and will come back once a real S3 bucket is available
      # for the e2e test to target. Structural coverage (the chart renders
      # valid manifests with these enabled) still lives in
      # tests/render/backups-and-imports.yaml.

      - name: Diagnostics on failure
        if: failure()
        run: |
          echo "::group::resources"
          kubectl get all -n wordpress || true
          kubectl -n wordpress get events --sort-by=.lastTimestamp | tail -n 50 || true
          kubectl -n wordpress get ingress,pvc,cronjob,job -o wide || true
          echo "::endgroup::"
          echo "::group::pod status overview"
          kubectl -n wordpress get pods -o wide || true
          echo "::endgroup::"
          for p in $(kubectl -n wordpress get pods -o name); do
            echo "::group::$p"
            kubectl -n wordpress describe "$p" | tail -n 60 || true
            echo "--- current logs ---"
            kubectl -n wordpress logs "$p" --all-containers --tail=200 || true
            echo "--- previous logs (last container instance, in case of crash loop) ---"
            kubectl -n wordpress logs "$p" --all-containers --previous --tail=200 2>/dev/null || true
            echo "::endgroup::"
          done
